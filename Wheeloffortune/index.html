<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNAP360 | Spin Machine</title>
<style>
  :root{
    --bg:#000000;
    --panel:#0e0e0e;
    --panel2:#161616;
    --gold:#dd9a3e;
    --gold-light:#f0c27a;
    --white:#ffffff;
    --gray:#8a8a8a;
    --border:#2a2a2a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:radial-gradient(circle at 50% 0%, #141414 0%, #000000 60%);
    color:var(--white);
    font-family:'Segoe UI',Arial,Helvetica,sans-serif;
    overflow-x:hidden;
  }
  .app{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 16px 60px;
  }
  header{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    margin-bottom:6px;
    padding-top:8px;
  }
  header::before{
    content:"";
    position:absolute;
    top:-40px;left:50%;
    transform:translateX(-50%);
    width:340px;
    height:220px;
    background:radial-gradient(ellipse at center, rgba(221,154,62,.22) 0%, rgba(221,154,62,0) 70%);
    pointer-events:none;
    z-index:0;
  }
  header img{
    height:64px;
    width:auto;
    position:relative;
    z-index:1;
    filter:drop-shadow(0 4px 18px rgba(221,154,62,.35));
  }
  header .kicker{
    position:relative;
    z-index:1;
    font-size:12px;
    font-weight:700;
    letter-spacing:6px;
    text-transform:uppercase;
    color:var(--gold);
    margin-top:2px;
  }
  h1{
    font-size:17px;
    font-weight:600;
    letter-spacing:1px;
    color:var(--white);
    margin:8px 0 30px;
  }
  h1 .accent{ color:var(--gold); }
  .layout{
    display:flex;
    gap:40px;
    align-items:flex-start;
    flex-wrap:wrap;
    justify-content:center;
    width:100%;
    max-width:1180px;
  }
  .wheel-col{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
  }
  .wheel-wrap{
    position:relative;
    width:min(70vw, 480px);
    height:min(70vw, 480px);
  }
  .pointer{
    position:absolute;
    top:-6px;
    left:50%;
    transform:translateX(-50%);
    width:0;height:0;
    border-left:20px solid transparent;
    border-right:20px solid transparent;
    border-top:34px solid var(--gold);
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.6));
    z-index:5;
  }
  canvas#wheel{
    width:100%;
    height:100%;
    border-radius:50%;
    box-shadow:
      0 0 0 6px #000,
      0 0 0 9px var(--gold),
      0 20px 60px rgba(0,0,0,.7),
      inset 0 0 40px rgba(0,0,0,.5);
    background:#000;
  }
  .hub{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:20%;
    height:20%;
    border-radius:50%;
    background:#000000;
    box-shadow:0 0 0 4px #000, 0 0 0 6px var(--gold), 0 6px 18px rgba(0,0,0,.6);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    user-select:none;
    z-index:4;
  }
  .hub span{
    font-weight:800;
    color:#000;
    font-size:clamp(12px,2.2vw,18px);
    letter-spacing:1px;
  }
  .hub:active{ transform:translate(-50%,-50%) scale(.96); }
  .hub-logo{
    width:84%;
    height:84%;
    object-fit:contain;
    pointer-events:none;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));
  }
  .sr-only{
    position:absolute;
    width:1px;height:1px;
    padding:0;margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    border:0;
  }
  .settings-block{
    margin-top:14px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .settings-block .row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:13px;
    color:var(--white);
  }
  .settings-block .row span.val{
    color:var(--gold);
    font-variant-numeric:tabular-nums;
  }
  input[type=range]{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:4px;
    background:#333;
    border-radius:2px;
    outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:16px;height:16px;
    border-radius:50%;
    background:var(--gold);
    cursor:pointer;
    border:2px solid #000;
  }
  input[type=range]::-moz-range-thumb{
    width:16px;height:16px;
    border-radius:50%;
    background:var(--gold);
    cursor:pointer;
    border:2px solid #000;
  }

  .controls{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    justify-content:center;
  }
  button{
    font-family:inherit;
    cursor:pointer;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--white);
    padding:10px 18px;
    border-radius:8px;
    font-size:13px;
    letter-spacing:.5px;
    transition:all .15s ease;
  }
  button:hover{ border-color:var(--gold); color:var(--gold); }
  button.primary{
    background:linear-gradient(180deg, var(--gold-light), var(--gold));
    color:#000;
    font-weight:700;
    border:none;
  }
  button.primary:hover{ filter:brightness(1.08); color:#000; }
  button:disabled{ opacity:.4; cursor:not-allowed; }

  .panel{
    width:340px;
    max-width:90vw;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px;
  }
  .panel h2{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:2px;
    color:var(--gold);
    margin:0 0 12px;
  }
  textarea{
    width:100%;
    min-height:280px;
    resize:vertical;
    background:#080808;
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--white);
    padding:12px;
    font-size:14px;
    line-height:1.6;
    font-family:inherit;
  }
  textarea:focus{ outline:none; border-color:var(--gold); }
  .meta-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:10px;
    font-size:12px;
    color:var(--gray);
  }
  .toggle-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:14px;
    font-size:13px;
    color:var(--white);
  }
  .switch{
    position:relative;
    width:38px;height:20px;
    display:inline-block;
  }
  .switch input{ display:none; }
  .slider{
    position:absolute;inset:0;
    background:#333;
    border-radius:20px;
    transition:.2s;
  }
  .slider:before{
    content:"";
    position:absolute;
    height:16px;width:16px;
    left:2px;top:2px;
    background:var(--white);
    border-radius:50%;
    transition:.2s;
  }
  .switch input:checked + .slider{ background:var(--gold); }
  .switch input:checked + .slider:before{ transform:translateX(18px); background:#000; }

  /* Winner modal */
  .overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.75);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
    backdrop-filter:blur(3px);
  }
  .overlay.show{ display:flex; }
  .modal{
    background:linear-gradient(180deg,#141414,#0a0a0a);
    border:1px solid var(--gold);
    border-radius:18px;
    padding:38px 46px;
    text-align:center;
    box-shadow:0 0 60px rgba(221,154,62,.25);
    max-width:90vw;
    animation:pop .25s ease;
  }
  @keyframes pop{ from{ transform:scale(.85); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .modal .label{
    font-size:12px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:10px;
  }
  .modal .winner-name{
    font-size:clamp(28px,5vw,46px);
    font-weight:800;
    color:var(--white);
    margin-bottom:24px;
    word-break:break-word;
  }
  .modal-actions{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
  }
  footer{
    margin-top:36px;
    color:#555;
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
  }
  canvas#confetti{
    position:fixed;inset:0;
    pointer-events:none;
    z-index:60;
  }
  @media (max-width:760px){
    .layout{ flex-direction:column; align-items:center; }
    .panel{ width:100%; }
  }
</style>
</head>

    <div class="kicker">Spin Machine</div>
  </header>
  <h1>Draai. Land. <span class="accent">Winnaar.</span></h1>

  <div class="layout">
    <div class="wheel-col">
      <div class="wheel-wrap">
        <div class="pointer"></div>
        <canvas id="wheel" width="900" height="900"></canvas>
        <div class="hub" id="spinBtn"><img class="hub-logo" id="hubLogo" alt="" src=""><span class="sr-only">SPIN</span></div>
      </div>
      <div class="controls">
        <button class="primary" id="spinBtnBottom">Draai het rad</button>
        <button id="shuffleBtn">Shuffle kleuren</button>
        <button id="fullscreenBtn">Volledig scherm</button>
      </div>
    </div>

    <div class="panel">
      <h2>Namen / Opties</h2>
      <textarea id="namesInput" spellcheck="false"></textarea>
      <div class="meta-row">
        <span id="countLabel">0 opties</span>
        <button id="clearBtn" style="padding:4px 10px;font-size:11px;">Wissen</button>
      </div>
      <div class="toggle-row">
        <span>Verwijder winnaar na spin</span>
        <label class="switch">
          <input type="checkbox" id="removeWinnerToggle">
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-row">
        <span>Geluid</span>
        <label class="switch">
          <input type="checkbox" id="soundToggle" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="settings-block">
        <div class="row">
          <span>Snelheid (spinduur)</span>
          <span class="val" id="speedValue">5.2s</span>
        </div>
        <input type="range" id="speedSlider" min="2" max="12" step="0.2" value="5.2">

        <div class="row" style="margin-top:8px;">
          <span>Aantal rondes</span>
          <span class="val" id="spinsValue">7</span>
        </div>
        <input type="range" id="spinsSlider" min="2" max="25" step="1" value="7">
      </div>
    </div>
  </div>

  <footer>SNAP360 &copy; <span id="year"></span></footer>
</div>

<div class="overlay" id="winnerOverlay">
  <div class="modal">
    <div class="label">De winnaar is</div>
    <div class="winner-name" id="winnerName">—</div>
    <div class="modal-actions">
      <button class="primary" id="closeModalBtn">Sluiten</button>
      <button id="removeAndSpinBtn">Verwijder &amp; draai opnieuw</button>
    </div>
  </div>
</div>

<script>
(function(){
  document.getElementById('year').textContent = new Date().getFullYear();

  // ---------- Palette (SNAP360 brand: black / gold / white / grays) ----------
  const PALETTE = [
    '#ffffff', '#000000', '#dd9a3e'
  ];

  const defaultNames = [
    'Anna','Bram','Charlotte','Daan','Emma','Finn','Gitte','Hugo'
  ];

  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const namesInput = document.getElementById('namesInput');
  const countLabel = document.getElementById('countLabel');
  const spinBtn = document.getElementById('spinBtn');
  const spinBtnBottom = document.getElementById('spinBtnBottom');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const clearBtn = document.getElementById('clearBtn');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const removeWinnerToggle = document.getElementById('removeWinnerToggle');
  const soundToggle = document.getElementById('soundToggle');
  const winnerOverlay = document.getElementById('winnerOverlay');
  const winnerNameEl = document.getElementById('winnerName');
  const closeModalBtn = document.getElementById('closeModalBtn');
  const removeAndSpinBtn = document.getElementById('removeAndSpinBtn');
  const speedSlider = document.getElementById('speedSlider');
  const spinsSlider = document.getElementById('spinsSlider');
  const speedValue = document.getElementById('speedValue');
  const spinsValue = document.getElementById('spinsValue');
  const hubLogo = document.getElementById('hubLogo');

  // Reuse the header logo image as the wheel's center hub logo
  const headerLogo = document.querySelector('header img');
  if(headerLogo && hubLogo){ hubLogo.src = headerLogo.src; }

  speedSlider.addEventListener('input', () => {
    speedValue.textContent = parseFloat(speedSlider.value).toFixed(1) + 's';
  });
  spinsSlider.addEventListener('input', () => {
    spinsValue.textContent = spinsSlider.value;
  });

  let colorOrder = [...PALETTE];
  let rotation = 0; // current rotation in radians
  let spinning = false;
  let segments = [];

  namesInput.value = defaultNames.join('\n');

  function getNames(){
    return namesInput.value
      .split('\n')
      .map(s => s.trim())
      .filter(Boolean);
  }

  function updateCount(){
    const n = getNames().length;
    countLabel.textContent = n + (n === 1 ? ' optie' : ' opties');
  }

  function drawWheel(){
    const names = getNames();
    segments = names;
    const size = canvas.width;
    const cx = size/2, cy = size/2, r = size/2 - 10;
    ctx.clearRect(0,0,size,size);

    if(names.length === 0){
      ctx.beginPath();
      ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.fillStyle = '#111';
      ctx.fill();
      ctx.fillStyle = '#666';
      ctx.font = '28px Segoe UI, Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Voeg namen toe', cx, cy);
      return;
    }

    const anglePer = (Math.PI*2) / names.length;

    for(let i=0;i<names.length;i++){
      const start = rotation + i*anglePer;
      const end = start + anglePer;
      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,r,start,end);
      ctx.closePath();
      ctx.fillStyle = colorOrder[i % colorOrder.length];
      ctx.fill();
      ctx.save();
      ctx.strokeStyle = '#dd9a3e';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();

      // label
      ctx.save();
      ctx.translate(cx,cy);
      ctx.rotate(start + anglePer/2);
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      const bg = colorOrder[i % colorOrder.length];
      const isDark = isColorDark(bg);
      ctx.fillStyle = isDark ? '#ffffff' : '#000000';
      const fontSize = Math.max(14, Math.min(26, 240/Math.max(names.length,6)));
      ctx.font = '600 ' + fontSize + 'px Segoe UI, Arial';
      let label = names[i];
      const maxLen = 22;
      if(label.length > maxLen) label = label.slice(0,maxLen-1) + '…';
      ctx.fillText(label, r - 18, 0);
      ctx.restore();
    }

    // outer ring accent
    ctx.beginPath();
    ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#dd9a3e';
    ctx.stroke();
  }

  function isColorDark(hex){
    const c = hex.replace('#','');
    const r = parseInt(c.substring(0,2),16);
    const g = parseInt(c.substring(2,4),16);
    const b = parseInt(c.substring(4,6),16);
    const lum = (0.299*r + 0.587*g + 0.114*b);
    return lum < 140;
  }

  function base64ToArrayBuffer(base64str){
    const binary = atob(base64str);

  }
  window.addEventListener('pointerdown', unlockAudio, { once:true });
  window.addEventListener('keydown', unlockAudio, { once:true });

  function playButtonSound(){
    if(!soundToggle.checked) return;
    const ctx = getAudioCtx();
    if(!ctx || !buttonBuffer) return;
    if(ctx.state === 'suspended') ctx.resume().catch(()=>{});
    try{
      const src = ctx.createBufferSource();
      src.buffer = buttonBuffer;
      src.connect(ctx.destination);
      src.start(0);
    }catch(e){}
  }

  function playSpinSound(durationMs){
    if(!soundToggle.checked) return;
    const ctx = getAudioCtx();
    if(!ctx || !spinBuffer) return;
    if(ctx.state === 'suspended') ctx.resume().catch(()=>{});
    stopSpinSound();
    try{
      const src = ctx.createBufferSource();
      src.buffer = spinBuffer;
      const rate = SPIN_AUDIO_DURATION / (durationMs/1000);
      src.playbackRate.value = Math.min(4, Math.max(0.4, rate));
      src.connect(ctx.destination);
      src.start(0);
      currentSpinSource = src;
    }catch(e){}
  }

  function stopSpinSound(){
    if(currentSpinSource){
      try{ currentSpinSource.stop(); }catch(e){}
      currentSpinSource = null;
    }
  }

  // ---------- Spin logic ----------
  function spin(){
    if(spinning) return;
    const names = getNames();
    if(names.length < 2){
      alert('Voeg minstens 2 namen toe om te draaien.');
      return;
    }
    spinning = true;
    spinBtn.style.pointerEvents = 'none';
    spinBtnBottom.disabled = true;
    playButtonSound();

    const anglePer = (Math.PI*2) / names.length;
    const winnerIndex = Math.floor(Math.random()*names.length);

    // Target: pointer is at top (angle = -PI/2 in standard math, but our 0 is at 3 o'clock)
    // We want the winning segment's center to end up at the top (pointing angle -PI/2)
    const targetSegCenter = winnerIndex*anglePer + anglePer/2;
    const pointerAngle = -Math.PI/2;
    const extraSpins = parseInt(spinsSlider.value, 10); // full turns, user-controlled
    // final rotation such that (rotation + targetSegCenter) mod 2PI == pointerAngle
    let finalRotation = pointerAngle - targetSegCenter + Math.PI*2*extraSpins;
    // normalize starting point relative to current rotation to always spin forward
    const startRotation = rotation;
    const delta = finalRotation - (startRotation % (Math.PI*2));

    const duration = parseFloat(speedSlider.value) * 1000; // ms, user-controlled
    const startTime = performance.now();
    const startRot = rotation;
    const totalDelta = delta < 0 ? delta + Math.PI*2*extraSpins : delta;

    playSpinSound(duration);

    function easeOutCubicQuint(t){
      return 1 - Math.pow(1-t, 4.2);
    }

    function frame(now){
      const t = Math.min(1, (now-startTime)/duration);
      const eased = easeOutCubicQuint(t);
      rotation = startRot + totalDelta*eased;
      drawWheel();

      if(t < 1){
        requestAnimationFrame(frame);
      }else{
        spinning = false;
        spinBtn.style.pointerEvents = 'auto';
        spinBtnBottom.disabled = false;
        stopSpinSound();
        showWinner(names[winnerIndex]);
      }
    }
    requestAnimationFrame(frame);
  }

  function showWinner(name){
    winnerNameEl.textContent = name;
    winnerOverlay.classList.add('show');
    launchConfetti();
    if(removeWinnerToggle.checked){
      removeAndSpinBtn.style.display = 'inline-block';
      removeAndSpinBtn.dataset.name = name;
    }else{
      removeAndSpinBtn.style.display = 'none';
    }
  }

  closeModalBtn.addEventListener('click', () => {
    winnerOverlay.classList.remove('show');
  });

  removeAndSpinBtn.addEventListener('click', () => {
    const name = removeAndSpinBtn.dataset.name;
    const lines = getNames().filter(n => n !== name);
    namesInput.value = lines.join('\n');
    updateCount();
    drawWheel();
    winnerOverlay.classList.remove('show');
    setTimeout(spin, 300);
  });

  namesInput.addEventListener('input', () => {
    updateCount();
    drawWheel();
  });

  spinBtn.addEventListener('click', spin);
  spinBtnBottom.addEventListener('click', spin);

  shuffleBtn.addEventListener('click', () => {
    colorOrder = [...colorOrder].sort(() => Math.random()-0.5);
    drawWheel();
  });

  clearBtn.addEventListener('click', () => {
    namesInput.value = '';
    updateCount();
    drawWheel();
  });

  fullscreenBtn.addEventListener('click', () => {
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(()=>{});
    }else{
      document.exitFullscreen();
    }
  });

  // ---------- Confetti ----------
  const confettiCanvas = document.getElementById('confetti');
  const cctx = confettiCanvas.getContext('2d');
  function resizeConfetti(){
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeConfetti);
  resizeConfetti();

  let confettiParticles = [];
  let confettiRunning = false;

  function launchConfetti(){
    const colors = ['#dd9a3e','#f0c27a','#ffffff','#c18736'];
    confettiParticles = [];
    const count = 140;
    for(let i=0;i<count;i++){
      confettiParticles.push({
        x: confettiCanvas.width/2,
        y: confettiCanvas.height/3,
        vx: (Math.random()-0.5)*14,
        vy: Math.random()*-14 - 4,
        size: Math.random()*7+4,
        color: colors[Math.floor(Math.random()*colors.length)],
        rot: Math.random()*Math.PI*2,
        vrot: (Math.random()-0.5)*0.3,
        life: 0,
        maxLife: 130 + Math.random()*40
      });
    }
    if(!confettiRunning){
      confettiRunning = true;
      requestAnimationFrame(confettiFrame);
    }
  }

  function confettiFrame(){
    cctx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height);
    let alive = false;
    for(const p of confettiParticles){
      if(p.life > p.maxLife) continue;
      alive = true;
      p.vy += 0.35; // gravity
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vrot;
      p.life++;
      const alpha = 1 - (p.life/p.maxLife);
      cctx.save();
      cctx.translate(p.x,p.y);
      cctx.rotate(p.rot);
      cctx.globalAlpha = Math.max(alpha,0);
      cctx.fillStyle = p.color;
      cctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
      cctx.restore();
    }
    if(alive){
      requestAnimationFrame(confettiFrame);
    }else{
      confettiRunning = false;
      cctx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height);
    }
  }

  // Fixed internal resolution (900x900); CSS scales the canvas responsively.
  updateCount();
  drawWheel();
})();
</script>
</body>
</html>
