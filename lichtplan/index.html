<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SNAP360 Lichtplan</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B2530">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lichtplan">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#D7DAD4; --panel:#EEF0EB; --panel2:#E2E5DF; --floor:#E7E9E3;
  --ink:#1B2530; --muted:#55606A; --line:rgba(27,37,48,.14);
  --gold:#D5943B; --gold-ink:#8A5A17; --player:#2F5D8A; --warn:#B4541E; --ok:#3C7A4A;
  --beam:rgba(213,148,59,.18); --body:rgba(47,93,138,.35);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#151C22; --panel:#1E272F; --panel2:#27323B; --floor:#19222A;
    --ink:#E4E8E2; --muted:#98A3AC; --line:rgba(228,232,226,.13);
    --gold-ink:#E7B270; --player:#7EA6CF; --warn:#E58A5A; --ok:#79B98A;
    --beam:rgba(213,148,59,.16); --body:rgba(126,166,207,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151C22; --panel:#1E272F; --panel2:#27323B; --floor:#19222A;
  --ink:#E4E8E2; --muted:#98A3AC; --line:rgba(228,232,226,.13);
  --gold-ink:#E7B270; --player:#7EA6CF; --warn:#E58A5A; --ok:#79B98A;
  --beam:rgba(213,148,59,.16); --body:rgba(126,166,207,.35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Barlow,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.cond{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif}

.top{max-width:1320px;margin:0 auto;padding:26px 20px 18px;display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between}
h1{font:700 clamp(44px,7vw,72px)/.88 "Barlow Condensed","Arial Narrow",sans-serif;margin:0;letter-spacing:-.01em}
h1 small{display:block;font:600 17px/1.2 Barlow,sans-serif;color:var(--gold-ink);letter-spacing:0;margin-bottom:6px}
.lede{margin:.55em 0 0;color:var(--muted);max-width:48ch}
.switches{display:flex;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel2);border-radius:999px;padding:3px}
.seg button{font:600 15px Barlow,sans-serif;border:0;background:transparent;color:var(--muted);padding:9px 18px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg.sm button{padding:9px 13px}

.wrap{max-width:1320px;margin:0 auto;padding:0 20px 56px;display:grid;grid-template-columns:330px minmax(0,1fr);gap:26px;align-items:start}
@media (max-width:900px){.wrap{grid-template-columns:1fr}}

.inputs{background:var(--panel);border-radius:16px;padding:18px 18px 6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto}
@media (max-width:900px){.inputs{position:static;max-height:none}}
fieldset{border:0;padding:0;margin:0 0 20px;display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;min-width:0}
fieldset[hidden]{display:none}
legend{font:600 21px/1 "Barlow Condensed",sans-serif;padding:0;margin-bottom:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
label.wide{grid-column:1/-1}
input,select{font:500 16px Barlow,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
select:disabled{opacity:.45}
label.check{flex-direction:row;align-items:center;gap:9px;grid-column:1/-1;font-size:15px;color:var(--ink);cursor:pointer}
label.check input{width:19px;height:19px;accent-color:var(--gold);flex:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.kitbox{margin:0 0 20px;border-bottom:1px solid var(--line)}
.kitbox summary{cursor:pointer;font:600 21px/1 "Barlow Condensed",sans-serif;padding:2px 0 14px}
.kitbox summary span{font:500 14px Barlow,sans-serif;color:var(--muted);margin-left:10px}
input[type="color"]{height:42px;padding:3px 4px;cursor:pointer}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-left:6px;vertical-align:-1px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.g-fx{fill:var(--muted);fill-opacity:.16;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:3 5}
.g-fxw{fill:var(--player);fill-opacity:.14;stroke:var(--player);stroke-width:1.2;stroke-dasharray:3 5}
.g-src{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.kh{grid-column:1/-1;margin:8px 0 -2px;font-size:14px;font-weight:600;color:var(--ink)}
td b{font:700 20px/1.1 "Barlow Condensed",sans-serif;white-space:nowrap}
.plan{min-width:0}
.setbar{display:flex;flex-wrap:wrap;gap:8px 30px;padding:2px 2px 16px;border-bottom:2px solid var(--ink)}
.setbar div{display:flex;flex-direction:column;min-width:0}
.setbar b{font:700 clamp(28px,3.4vw,40px)/1 "Barlow Condensed",sans-serif}
.setbar span{font-size:13px;color:var(--muted)}

.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:26px;margin-top:22px;align-items:start}
@media (max-width:1150px){.grid2{grid-template-columns:1fr}}
figure{margin:0}
.floor{background:var(--floor);border-radius:16px;padding:10px 10px 12px;border:1px solid var(--line)}
.floor figcaption{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding:2px 6px 8px}
.floor figcaption b{font:600 18px "Barlow Condensed",sans-serif;color:var(--ink)}
svg{display:block;width:100%;height:auto;max-width:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);padding:8px 6px 0}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}

h2{font:600 25px/1.1 "Barlow Condensed",sans-serif;margin:0 0 10px}
.blk{margin-top:28px}
.blk:first-child{margin-top:0}
.lines p{margin:0 0 9px;max-width:72ch}
.lines b{font-weight:600}

.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:13px;padding:6px 10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.id{font:700 26px/1 "Barlow Condensed",sans-serif;color:var(--gold-ink);width:40px}
td .sub{display:block;color:var(--muted);font-size:13px}

.warns{display:grid;gap:8px}
.warn{border-left:4px solid var(--warn);padding:9px 14px;background:var(--panel);border-radius:0 10px 10px 0;max-width:80ch}

.even .verdict{margin:0 0 10px}
.even .verdict.ok{color:var(--ok)}
.even .verdict.bad{color:var(--warn)}
.erow{display:flex;gap:10px;align-items:center;margin:4px 0}
.erow .lab{width:108px;flex:none;font-size:13px;color:var(--muted)}
.cells{display:flex;gap:3px;flex-wrap:wrap}
.cell{min-width:36px;height:30px;padding:0 4px;border-radius:6px;font:600 13px "Barlow Condensed",sans-serif;display:grid;place-items:center;color:#1B2530}
.cell.co{box-shadow:inset 0 0 0 2px var(--ink)}
.cell.off{outline:2px solid var(--warn);outline-offset:1px}

.checks{list-style:none;padding:0;margin:0;columns:2 330px;column-gap:30px}
.checks li{break-inside:avoid;padding:0 0 11px 30px;position:relative;cursor:pointer;max-width:62ch}
.checks li::before{content:"";position:absolute;left:0;top:.2em;width:17px;height:17px;border:2px solid var(--gold);border-radius:5px}
.checks li.done{color:var(--muted);text-decoration:line-through}
.checks li.done::before{background:var(--gold)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.btn{font:600 15px Barlow,sans-serif;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:10px 18px;border-radius:999px;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg)}
.toast{font-size:14px;color:var(--ok);align-self:center}

/* svg */
.g-grid{stroke:var(--line);stroke-width:1}
.g-fov{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 6;fill:none}
.g-beam{fill:var(--beam)}
.g-mod{stroke:var(--gold);stroke-width:7;stroke-linecap:round}
.g-lamp{fill:var(--ink)}
.g-pl{fill:var(--player)}
.g-co{fill:var(--gold);stroke:var(--ink);stroke-width:1.5}
.g-cam{fill:var(--ink)}
.g-lbl{font:700 17px "Barlow Condensed",sans-serif;fill:var(--ink)}
.g-sm{font:500 13px Barlow,sans-serif;fill:var(--muted)}
.g-dim{stroke:var(--ink);stroke-width:1;stroke-dasharray:2 4}
.g-dimw{stroke:var(--ink);stroke-width:1}
.g-bgl{stroke:var(--muted);stroke-width:7;stroke-linecap:round}
.g-ground{stroke:var(--ink);stroke-width:1.5}
.g-body{stroke:var(--body);stroke-linecap:round}
.g-stand{stroke:var(--muted);stroke-width:2}
.g-aim{stroke:var(--gold);stroke-width:1.4;stroke-dasharray:4 5;fill:none}
.g-sight{stroke:var(--ink);stroke-width:1;stroke-dasharray:3 5;fill:none;opacity:.6}
@media (prefers-reduced-motion:no-preference){.plan svg{transition:opacity .15s}}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1><small>SNAP360</small>Lichtplan</h1>
    <p class="lede">Vul de shoot in. Opstelling, camera en flitsers worden voor je uitgerekend en getekend.</p>
  </div>
  <div class="switches">
    <div class="seg" role="group" aria-label="Soort shoot">
      <button type="button" data-mode="team" aria-pressed="true">Teamfoto</button>
      <button type="button" data-mode="portrait" aria-pressed="false">Portret</button>
    </div>
    <div class="seg sm" role="group" aria-label="Eenheid">
      <button type="button" data-unit="m" aria-pressed="true">meter</button>
      <button type="button" data-unit="ft" aria-pressed="false">feet</button>
    </div>
  </div>
</header>

<main class="wrap">
  <aside class="inputs">
    <form id="form" onsubmit="return false">
      <details class="kitbox" open>
        <summary>Mijn kit<span id="kitSum"></span></summary>
        <fieldset>
          <label>Kit<select id="k_sel"><option value="0">Kit 1</option><option value="1">Kit 2</option><option value="2">Kit 3</option></select></label>
          <label>Naam<input id="k_name" data-kit type="text" maxlength="30"></label>
          <p class="kh">Flitsers</p>
          <label>AD600BM<input id="k_ad600bm" data-kit type="number" min="0" max="20" inputmode="numeric"></label>
          <label>AD600 Pro<input id="k_ad600p" data-kit type="number" min="0" max="20" inputmode="numeric"></label>
          <label>AD600 Pro II<input id="k_ad600p2" data-kit type="number" min="0" max="20" inputmode="numeric"></label>
          <label>AD400 Pro<input id="k_ad400p" data-kit type="number" min="0" max="20" inputmode="numeric"></label>
          <label>AD200 Pro<input id="k_ad200p" data-kit type="number" min="0" max="20" inputmode="numeric"></label>
          <p class="kh">Lichtvormers</p>
          <label>Grote paraplu<input id="k_umb" data-kit type="number" min="0" max="20" inputmode="numeric"></label>
          <label>Octabox 120 cm<input id="k_oct120" data-kit type="number" min="0" max="20" inputmode="numeric"></label>
          <label>Octabox 90 cm<input id="k_oct90" data-kit type="number" min="0" max="20" inputmode="numeric"></label>
          <label>Softbox 60×90<input id="k_sb" data-kit type="number" min="0" max="20" inputmode="numeric"></label>
          <label>Stripbox 30×120<input id="k_strip" data-kit type="number" min="0" max="20" inputmode="numeric"></label>
          <label>Beauty dish<input id="k_bd" data-kit type="number" min="0" max="20" inputmode="numeric"></label>
          <label>Reflector + grid<input id="k_grid" data-kit type="number" min="0" max="20" inputmode="numeric"></label>
          <label>Reflectiescherm<input id="k_refl" data-kit type="number" min="0" max="20" inputmode="numeric"></label>
          <label>Westcott Deep Focus 45°<input id="k_dfr" data-kit type="number" min="0" max="20" inputmode="numeric"></label>
          <label>Gelset<input id="k_gels" data-kit type="number" min="0" max="20" inputmode="numeric"></label>
          <p class="kh">Statieven</p>
          <label>Lichtstatieven<input id="k_stands" data-kit type="number" min="0" max="20" inputmode="numeric"></label>
          <label>Hoogste (<span class="u">m</span>)<input id="k_standH" data-kit data-len type="number" min="1" step="0.1" inputmode="decimal"></label>
        </fieldset>
      </details>

      <!-- TEAM -->
      <fieldset data-for="team">
        <legend>Groep</legend>
        <label>Spelers<input id="t_players" type="number" min="1" max="80" value="20" inputmode="numeric"></label>
        <label>Coaches en staf<input id="t_coaches" type="number" min="0" max="10" value="1" inputmode="numeric"></label>
        <label class="wide">Leeftijd
          <select id="t_age"><option value="volw">Volwassenen</option><option value="jeugd">Jeugd 12–16</option><option value="kids">Kinderen tot 12</option></select></label>
        <label>Opstelling
          <select id="t_layout"><option value="rows">Rijen</option><option value="arc">Rijen in een boog</option><option value="v">V-vorm</option><option value="line">Eén lange rij</option></select></label>
        <label>Aantal rijen
          <select id="t_rows"><option value="auto">Automatisch</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></label>
        <label class="wide">Coach en staf
          <select id="t_coachpos"><option value="front-mid">Vooraan in het midden</option><option value="back-ends">Achteraan op de uiteinden</option><option value="front-ends">Vooraan op de uiteinden</option></select></label>
      </fieldset>
      <fieldset data-for="team">
        <legend>Plek en camera</legend>
        <label class="wide">Locatie
          <select id="t_loc"><option value="in">Binnen (zaal, studio)</option><option value="sun">Buiten, zon</option><option value="cloud">Buiten, bewolkt of schaduw</option></select></label>
        <label class="wide">Vrije ruimte vóór de groep (<span class="u">m</span>)<input id="t_space" data-len type="number" min="1" step="0.1" value="15" inputmode="decimal"></label>
        <label>Sensor
          <select id="t_sensor"><option value="ff">Full frame</option><option value="apsc">APS-C</option></select></label>
        <label>Brandpunt (mm)<input id="t_f" type="number" min="10" max="400" value="50" inputmode="numeric"></label>
      </fieldset>
      <fieldset data-for="team">
        <legend>Licht</legend>
        <label class="wide">Lichtvormer hoofdlichten
          <select id="t_mod"><option value="auto">Automatisch uit mijn kit</option><option value="umb">Grote paraplu</option><option value="oct120">Octabox 120 cm</option><option value="oct90">Octabox 90 cm</option><option value="sb">Softbox 60×90</option><option value="dfr">Westcott Deep Focus (hard, ver bereik)</option><option value="bare">Kale flits met reflector</option></select></label>
        <label class="check"><input id="t_glasses" type="checkbox"> Brildragers in de groep</label>
        <label class="check"><input id="t_rim" type="checkbox"> Rimlicht achter de groep</label>
        <label class="check"><input id="t_gel" type="checkbox"> Clubkleuren (gels) op de rimlichten</label>
        <label>Kleur links<input id="t_c1" type="color" value="#1f5fd1"></label>
        <label>Kleur rechts<input id="t_c2" type="color" value="#d5943b"></label>
        <label class="wide">Effect
          <select id="t_fx"><option value="none">Geen</option><option value="smoke">Rook achter de groep</option></select></label>
      </fieldset>

      <!-- PORTRAIT -->
      <fieldset data-for="portrait" hidden>
        <legend>Onderwerp</legend>
        <label class="wide">Stijl
          <select id="p_style"><option value="sport">Sport dramatisch (key + 2 rims)</option><option value="clean">Clean (key + invul)</option><option value="clam">Clamshell (beauty)</option><option value="rembrandt">Rembrandt</option><option value="split">Split</option></select></label>
        <label class="wide">Kader
          <select id="p_frame"><option value="full">Volledig lichaam</option><option value="tq">Driekwart (knie en hoger)</option><option value="half">Halflang (taille en hoger)</option><option value="head">Hoofd en schouders</option></select></label>
        <label>Lengte (<span class="u">m</span>)<input id="p_h" data-len type="number" min="0.8" step="0.01" value="1.8" inputmode="decimal"></label>
        <label>Achtergrond
          <select id="p_bg"><option value="dark">Zwart of donker</option><option value="gray">Grijs</option><option value="white">Wit</option></select></label>
      </fieldset>
      <fieldset data-for="portrait" hidden>
        <legend>Effect en kleur</legend>
        <label class="wide">Effect
          <select id="p_fx"><option value="none">Geen</option><option value="smoke_back">Rook achter het onderwerp</option><option value="smoke_floor">Lage rook rond de voeten</option><option value="water_splash">Waterspetters</option><option value="rain">Regen</option></select></label>
        <label class="wide">Kleur (gels)
          <select id="p_color"><option value="none">Geen, alles wit licht</option><option value="rims">Kleur op de rimlichten</option><option value="bg">Kleur op de achtergrond</option><option value="fx">Kleur in de rook of het water</option></select></label>
        <label>Kleur 1<input id="p_c1" type="color" value="#1f5fd1"></label>
        <label>Kleur 2<input id="p_c2" type="color" value="#d5943b"></label>
      </fieldset>
      <fieldset data-for="portrait" hidden>
        <legend>Plek en camera</legend>
        <label class="wide">Lengte van de ruimte, achtergrond tot achtermuur (<span class="u">m</span>)<input id="p_space" data-len type="number" min="2" step="0.1" value="9" inputmode="decimal"></label>
        <label>Sensor
          <select id="p_sensor"><option value="ff">Full frame</option><option value="apsc">APS-C</option></select></label>
        <label>Brandpunt (mm)<input id="p_f" type="number" min="10" max="400" value="85" inputmode="numeric"></label>
      </fieldset>
      <fieldset data-for="portrait" hidden>
        <legend>Licht</legend>
        <label class="wide">Hoofdlicht
          <select id="p_mod"><option value="auto">Automatisch uit mijn kit</option><option value="bd">Beauty dish 55 cm</option><option value="oct90">Octabox 90 cm</option><option value="oct120">Octabox 120 cm</option><option value="sb">Softbox 60×90 cm</option><option value="umb">Paraplu</option></select></label>
      </fieldset>
    </form>
  </aside>

  <section class="plan" aria-live="polite">
    <div class="setbar" id="setbar"></div>

    <div class="grid2">
      <figure class="floor">
        <figcaption><b>Bovenaanzicht</b><span>links en rechts zoals de camera het ziet, raster 1 m</span></figcaption>
        <svg id="svgTop" role="img" aria-label="Bovenaanzicht van de opstelling"></svg>
        <div class="legend" id="legend"></div>
      </figure>
      <div>
        <div class="blk lines" id="secLayout"></div>
        <div class="blk lines" id="secCam"></div>
        <div class="blk lines" id="secFx" hidden></div>
      </div>
    </div>

    <div class="blk" id="secLights"></div>
    <div class="blk lines" id="secKit"></div>

    <figure class="floor blk">
      <figcaption><b>Zijaanzicht</b><span>hoogtes van camera, lichten en hoofden</span></figcaption>
      <svg id="svgSide" role="img" aria-label="Zijaanzicht met hoogtes"></svg>
    </figure>

    <div class="blk even" id="secEven"></div>
    <div class="blk warns" id="secWarn"></div>
    <div class="blk" id="secCheck"></div>

    <div class="actions">
      <button type="button" class="btn primary" id="copyBtn">Kopieer plan als tekst</button>
      <button type="button" class="btn" id="resetChecks">Vinkjes wissen</button>
      <span class="toast" id="toast" role="status"></span>
    </div>
    <textarea id="copyArea" aria-hidden="true" tabindex="-1" style="position:absolute;left:-9999px;top:0"></textarea>
  </section>
</main>

<script>
(function(){
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const FT=3.28084, RAD=Math.PI/180, STORE='snap360-lichtplan-v1';
let mode='team', unit='m', lastPlan=null;

/* ---------- helpers ---------- */
const num=id=>{const v=parseFloat(String($('#'+id).value).replace(',','.'));return Number.isFinite(v)?v:0};
const len=id=>unit==='ft'?num(id)/FT:num(id);
const clampInt=(v,a,b)=>Math.max(a,Math.min(b,Math.round(v)));
const dec=(x,d=1)=>(Math.round(x*10**d)/10**d).toFixed(d).replace('.',',');
function fL(m,d=1){
  if(unit==='ft'){let t=Math.abs(m)*FT,ft=Math.floor(t),inch=Math.round((t-ft)*12);if(inch===12){ft++;inch=0}return `${ft}′${inch?` ${inch}″`:''}`}
  return `${dec(Math.abs(m),d)} m`;
}

function distribute(T,R){
  if(R<=1)return [T];
  let best=null,bestC=1e9;const a=[];
  const cost=v=>{let c=v[v.length-1];for(let i=1;i<v.length;i++){const d=v[i]-v[i-1];if(d%2===0)c+=.6;if(d>1)c+=.5*(d-1)}return c};

    if(r===R-1){if(rem<min)return;a[r]=rem;const c=cost(a);if(c<bestC){bestC=c;best=a.slice()}return}
    for(let n=min;n*(R-r)<=rem;n++){a[r]=n;rec(r+1,rem-n,n)}
  })(0,T,1);
  return best||[T];
}

function buildRows(T,C,R,s,pw,coachPos){
  const counts=distribute(T,R);R=counts.length;
  let offs=[0],flip=1;const shifted=[false];
  for(let r=1;r<R;r++){let o=offs[r-1],sh=false;if((counts[r]-counts[r-1])%2===0){o+=flip*pw/2;flip*=-1;sh=true}offs.push(o);shifted.push(sh)}
  const mid=(Math.max(...offs)+Math.min(...offs))/2;offs=offs.map(o=>o-mid);
  const people=[];
  for(let r=0;r<R;r++){const n=counts[r];for(let i=0;i<n;i++)people.push({x:(i-(n-1)/2)*pw+offs[r],z:r*.6,h:poseH(ROWP[R][r],s),row:r,i,coach:false})}
  let left=C;
  const order=(r,how)=>{const row=people.filter(p=>p.row===r);if(how==='mid')return row.sort((a,b)=>Math.abs(a.x)-Math.abs(b.x));const out=[];let lo=0,hi=row.length-1;while(lo<=hi){out.push(row[lo++]);if(lo<=hi)out.push(row[hi--])}return out};
  const rows=[...Array(R).keys()];if(coachPos==='back-ends')rows.reverse();
  const how=coachPos==='front-mid'?'mid':'ends';
  for(const r of rows){if(left<=0)break;for(const p of order(r,how)){if(left<=0)break;p.coach=true;left--}}
  return {people,counts,shifted,R};

function buildV(P,C,s,lines){

  const rem=P-(apexCoach?0:1),left=Math.ceil(rem/2),right=rem-left;
  const layers=left<=6?1:left<=12?2:3;
  const split=n=>{const a=[];for(let L=0;L<layers;L++)a.push(Math.floor(n/layers)+(L<n%layers?1:0));return a};
  const front={};
  [[-1,left],[1,right]].forEach(([sg,n])=>{const per=split(n);front[sg]=per[0];per.forEach((k,L)=>{for(let j=1;j<=k;j++)people.push({x:sg*(j*dx+L*dx*.5),z:j*dz+L*.7,h:poseH(L>=2?'bank':'staand',s),coach:false,arm:sg,j,layer:L})})});
  const extra=C-(apexCoach?1:0);
  for(let k=0;k<extra;k++){const sg=k%2?1:-1;const j=front[sg]+1+Math.floor(k/2);people.push({x:sg*j*dx,z:j*dz,h:poseH('staand',s),coach:true,arm:sg,j,layer:0})}

  const refPw=keyLights.filter(L=>L.alpha!==0).map(L=>L.pw);const ref=refPw.length?Math.min(...refPw):1;

  if(o.bg)g+=`<line class="g-bgl" x1="${X(o.bg.x1)}" y1="${Y(o.bg.z)}" x2="${X(o.bg.x2)}" y2="${Y(o.bg.z)}"/><text class="g-sm" x="${X(o.bg.x2)}" y="${(+Y(o.bg.z)-10)}" text-anchor="end">achtergrond</text>`;
  // distance dimension
  g+=`<line class="g-dim" x1="${X(o.cam.x)}" y1="${(+Y(o.cam.z)-16)}" x2="${X(o.cam.x)}" y2="${(+Y(o.zFront)+14)}"/>`;
  g+=`<text class="g-sm" x="${(+X(o.cam.x)+8)}" y="${((+Y(o.cam.z)+ +Y(o.zFront))/2).toFixed(1)}">${fL(o.dLabel)}</text>`;
  if(o.width){const y=+Y(o.width.z);g+=`<line class="g-dimw" x1="${X(o.width.x1)}" y1="${y}" x2="${X(o.width.x2)}" y2="${y}"/><line class="g-dimw" x1="${X(o.width.x1)}" y1="${y-5}" x2="${X(o.width.x1)}" y2="${y+5}"/><line class="g-dimw" x1="${X(o.width.x2)}" y1="${y-5}" x2="${X(o.width.x2)}" y2="${y+5}"/><text class="g-sm" x="${X(0)}" y="${y-7}" text-anchor="middle">${fL(o.width.W)} breed</text>`}
  // people
  const pr=Math.max(5,.2*sc);
  for(const p of o.people){
    if(p.subject){g+=`<ellipse class="g-pl" cx="${X(p.x)}" cy="${Y(p.z)}" rx="${Math.max(12,.25*sc).toFixed(1)}" ry="${Math.max(7,.14*sc).toFixed(1)}"/>`;continue}
    g+=`<circle class="${p.coach?'g-co':'g-pl'}" cx="${X(p.x)}" cy="${Y(p.z)}" r="${pr.toFixed(1)}"/>`;
  }
  // lights
  for(const L of o.lights){const dx=L.ax-L.x,dz=L.az-L.z,dist=Math.hypot(dx,dz)||1,ux=dx/dist,uz=dz/dist,px=-uz,pz=ux;
    const half=Math.max(9,(L.size||o.modSize)*sc/2)/sc;const cx=+X(L.x),cy=+Y(L.z);
    const bx=cx-ux*8,by=cy+uz*8;
    g+=`<circle class="g-lamp" cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="5"/>`;
    g+=`<line class="g-mod" x1="${X(L.x+px*half)}" y1="${Y(L.z+pz*half)}" x2="${X(L.x-px*half)}" y2="${Y(L.z-pz*half)}"/>`;
    g+=`<text class="g-lbl" x="${(cx-ux*26).toFixed(1)}" y="${(cy+uz*26+6).toFixed(1)}" text-anchor="middle">${L.id}</text>`}
  for(const f of (o.fx||[]))if(f.k==='src')g+=`<rect class="g-src" x="${(+X(f.x)-8).toFixed(1)}" y="${(+Y(f.z)-8).toFixed(1)}" width="16" height="16" rx="3"/><text class="g-sm" x="${X(f.x)}" y="${(+Y(f.z)+24).toFixed(1)}" text-anchor="middle">${f.label}</text>`;
  // camera
  const cx=+X(o.cam.x),cy=+Y(o.cam.z);
  g+=`<g transform="translate(${cx},${cy})"><rect class="g-cam" x="-15" y="-6" width="30" height="18" rx="3"/><rect class="g-cam" x="-8" y="-15" width="16" height="10" rx="2"/></g><text class="g-sm" x="${cx}" y="${cy+30}" text-anchor="middle">camera</text>`;
  const svg=$('#svgTop');svg.setAttribute('viewBox',`0 0 ${VW} ${VH+(cy+36>VH?cy+36-VH:0)}`);svg.innerHTML=g;
}

function drawSide(o){
  const zs=[o.cam.z,...o.lights.map(L=>L.z),...o.figs.map(f=>f.z)];if(o.bgZ!=null)zs.push(o.bgZ);
  const ys=[o.cam.y,...o.lights.map(L=>L.y),...o.figs.map(f=>(f.full||f.h+.15))];if(o.bgZ!=null)ys.push(2.4);
  const z0=Math.min(...zs)-.9,z1=Math.max(...zs)+.9,y1=Math.max(...ys)+.45;
  const VW=800,MAXH=330,PADB=24;let sc=VW/(z1-z0);if(y1*sc+PADB>MAXH)sc=(MAXH-PADB)/y1;
  const VH=Math.round(y1*sc+PADB),ox=(VW-(z1-z0)*sc)/2;
  const X=z=>(ox+(z-z0)*sc).toFixed(1),Y=y=>(VH-PADB-y*sc).toFixed(1);
  let g='';
  for(let y=1;y<y1;y++)g+=`<line class="g-grid" x1="${ox.toFixed(1)}" y1="${Y(y)}" x2="${(ox+(z1-z0)*sc).toFixed(1)}" y2="${Y(y)}"/><text class="g-sm" x="${(ox+4).toFixed(1)}" y="${(+Y(y)-4)}">${fL(y,0)}</text>`;
  g+=`<line class="g-ground" x1="${ox.toFixed(1)}" y1="${Y(0)}" x2="${(ox+(z1-z0)*sc).toFixed(1)}" y2="${Y(0)}"/>`;
  if(o.bgZ!=null)g+=`<line class="g-bgl" x1="${X(o.bgZ)}" y1="${Y(0)}" x2="${X(o.bgZ)}" y2="${Y(2.4)}"/>`;
  // figures (dedupe)
  const seen=new Set();const bw=Math.max(4,.3*sc);
  for(const f of o.figs){const k=f.z.toFixed(1)+'|'+f.h.toFixed(2)+(f.coach?'c':'');if(seen.has(k))continue;seen.add(k);
    const top=f.full?f.full:f.h+.12;
    g+=`<line class="g-body" stroke-width="${bw.toFixed(1)}" x1="${X(f.z)}" y1="${Y(Math.min(.1,top))}" x2="${X(f.z)}" y2="${Y(f.h-.14)}"/>`;
    g+=`<circle class="${f.coach?'g-co':'g-pl'}" cx="${X(f.z)}" cy="${Y(f.h)}" r="${Math.max(4,.11*sc).toFixed(1)}"/>`}
  // camera
  g+=`<line class="g-stand" x1="${X(o.cam.z)}" y1="${Y(0)}" x2="${X(o.cam.z)}" y2="${Y(o.cam.y)}"/>`;
  g+=`<line class="g-sight" x1="${X(o.cam.z)}" y1="${Y(o.cam.y)}" x2="${X(o.camAim.z)}" y2="${Y(o.camAim.y)}"/>`;
  g+=`<rect class="g-cam" x="${(+X(o.cam.z)-11)}" y="${(+Y(o.cam.y)-8)}" width="22" height="16" rx="3"/><text class="g-sm" x="${(+X(o.cam.z)-16)}" y="${(+Y(o.cam.y)+4)}" text-anchor="end">camera ${fL(o.cam.y)}</text>`;
  // lights (dedupe by z/y)
  const groups={};for(const L of o.lights){const k=L.z.toFixed(1)+'|'+L.y.toFixed(1);(groups[k]=groups[k]||[]).push(L)}
  for(const k in groups){const Ls=groups[k],L=Ls[0];
    g+=`<line class="g-stand" x1="${X(L.z)}" y1="${Y(0)}" x2="${X(L.z)}" y2="${Y(L.y)}"/>`;
    g+=`<line class="g-aim" x1="${X(L.z)}" y1="${Y(L.y)}" x2="${X(L.az)}" y2="${Y(L.ay)}"/>`;
    g+=`<circle class="g-lamp" cx="${X(L.z)}" cy="${Y(L.y)}" r="6"/>`;
    g+=`<text class="g-lbl" x="${(+X(L.z)+10)}" y="${(+Y(L.y)-9)}">${Ls.map(l=>l.id).join('/')} <tspan class="g-sm">${fL(L.y)}</tspan></text>`}
  const svg=$('#svgSide');svg.setAttribute('viewBox',`0 0 ${VW} ${VH}`);svg.innerHTML=g;
}

/* ---------- render ---------- */
function render(p){
  lastPlan=p;
  $('#setbar').innerHTML=p.setbar.map(s=>`<div><b>${s.v}</b><span>${s.l}</span></div>`).join('');
  $('#secLayout').innerHTML=`<h2>${p.layoutTitle}</h2>`+p.layoutLines.map(l=>`<p>${l}</p>`).join('');
  $('#secCam').innerHTML='<h2>Camera</h2>'+p.camLines.map(l=>`<p>${l}</p>`).join('');
  const hasFx=p.fxLines&&p.fxLines.length;$('#secFx').hidden=!hasFx;$('#secFx').innerHTML=hasFx?`<h2>${p.fxTitle}</h2>`+p.fxLines.map(l=>`<p>${l}</p>`).join(''):'';
  $('#legend').innerHTML=p.legend+((p.top.fx||[]).length?'<span><i style="background:var(--muted);opacity:.5"></i>effectzone</span><span><i style="background:var(--panel);border:2px solid var(--ink);border-radius:3px"></i>machine of helper</span>':'');
  $('#secKit').innerHTML=`<h2>Uit je kit: ${escH(p.kitName)}</h2>`+p.kitLines.map(l=>`<p>${l}</p>`).join('');
  $('#secLights').innerHTML=p.lightRows.length?`<h2>Lichten</h2><div class="tbl"><table><thead><tr><th></th><th>Rol en lichtvormer</th><th>Plaats</th><th>Hoogte</th><th>Kantelen</th><th>Richten op</th><th>Vermogen</th></tr></thead><tbody>${p.lightRows.map(r=>`<tr><td class="id">${r.id}</td><td>${r.role}<span class="sub">${r.mod}</span></td><td>${r.place}${r.sub?`<span class="sub">${r.sub}</span>`:''}</td><td>${r.height}</td><td>${r.tilt}</td><td>${r.aim}</td><td>${r.power}</td></tr>`).join('')}</tbody></table></div>`:'<h2>Lichten</h2><p>Geen flitsers ingepland.</p>';
  if(p.even){
    const ok=p.even.spread<=.34;
    $('#secEven').innerHTML=`<h2>Belichting per gezicht</h2><p class="verdict ${ok?'ok':'bad'}">${ok?'Gelijkmatig':'Ongelijk'}: ${dec(p.even.spread,1)} stop tussen het lichtste en het donkerste gezicht. Cijfers in stops t.o.v. het gemiddelde.</p>`+
      p.even.groups.map(g=>`<div class="erow"><span class="lab">${g.label}</span><div class="cells">${g.cells.map(c=>{const pct=Math.max(12,Math.min(92,55+c.ev*110));return `<span class="cell${c.coach?' co':''}${Math.abs(c.ev)>.2?' off':''}" style="background:#E6C394;background:color-mix(in srgb,#D5943B ${pct.toFixed(0)}%,#F4F1E8)" title="${c.coach?'Coach/staf':'Speler'}">${stops(c.ev)}</span>`}).join('')}</div></div>`).join('');
    $('#secEven').hidden=false;
  }else{$('#secEven').innerHTML='';$('#secEven').hidden=true}
  $('#secWarn').innerHTML=p.warnings.length?'<h2>Let op</h2>'+p.warnings.map(w=>`<div class="warn">${w}</div>`).join(''):'';
  $('#secWarn').hidden=!p.warnings.length;
  const done=loadDone();
  $('#secCheck').innerHTML='<h2>Waar op letten</h2><ul class="checks">'+p.checks.map((c,i)=>`<li tabindex="0" role="checkbox" aria-checked="${done.includes(c)}" class="${done.includes(c)?'done':''}">${c}</li>`).join('')+'</ul>';
  drawTop(p.top);drawSide(p.side);
}

function update(){try{render(mode==='team'?computeTeam():computePortrait())}catch(e){console.error(e)}save()}

/* ---------- persistence ---------- */
function save(){try{const v={};$$('#form input,#form select').forEach(el=>{if(el.matches('[data-kit],#k_sel'))return;v[el.id]=el.type==='checkbox'?el.checked:el.value});localStorage.setItem(STORE,JSON.stringify({mode,unit,curKit,v}))}catch(e){}}
function saveKits(){try{localStorage.setItem(KIT_STORE,JSON.stringify(kits))}catch(e){}}
function kitLabels(){[...$('#k_sel').options].forEach((o,i)=>o.textContent=kits[i].name);$('#k_sel').value=String(curKit);const n=flashList(kits[curKit]).length;$('#kitSum').textContent=`${kits[curKit].name}, ${n} flitser${n===1?'':'s'}`}
function kitToInputs(){const k=kits[curKit];$('#k_name').value=k.name;KIT_IDS.forEach(id=>$('#'+id).value=k[id]||0);const h=+k.k_standH||3;$('#k_standH').value=unit==='ft'?(h*FT).toFixed(1):h.toFixed(1);kitLabels()}
function kitFromInputs(){const k=kits[curKit];k.name=$('#k_name').value.trim()||('Kit '+(curKit+1));KIT_IDS.forEach(id=>k[id]=clampInt(num(id),0,20));k.k_standH=Math.max(1,len('k_standH'));saveKits();kitLabels()}
function restore(){try{const s=JSON.parse(localStorage.getItem(STORE)||'null');if(!s)return;unit=s.unit==='ft'?'ft':'m';mode=s.mode==='portrait'?'portrait':'team';curKit=[0,1,2].includes(s.curKit)?s.curKit:0;
  for(const id in s.v){const el=document.getElementById(id);if(!el)continue;if(el.tagName==='SELECT'&&![...el.options].some(o=>o.value===s.v[id]))continue;if(el.type==='checkbox')el.checked=!!s.v[id];else el.value=s.v[id]}}catch(e){}}
function loadDone(){try{return JSON.parse(localStorage.getItem(STORE+'-done')||'[]')}catch(e){return []}}
function saveDone(a){try{localStorage.setItem(STORE+'-done',JSON.stringify(a))}catch(e){}}

/* ---------- ui ---------- */
function applyMode(){$$('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));$$('fieldset[data-for]').forEach(f=>f.hidden=f.dataset.for!==mode)}
function applyUnit(){$$('[data-unit]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.unit===unit));$$('.u').forEach(e=>e.textContent=unit==='ft'?'ft':'m');$$('[data-len]').forEach(i=>i.step=unit==='ft'?'0.5':'0.1')}
function syncRows(){const l=$('#t_layout').value;$('#t_rows').disabled=(l==='v'||l==='line')}
$$('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;applyMode();update()}));
$$('[data-unit]').forEach(b=>b.addEventListener('click',()=>{const u=b.dataset.unit;if(u===unit)return;
  $$('[data-len]').forEach(i=>{const v=parseFloat(String(i.value).replace(',','.'));if(Number.isFinite(v))i.value=u==='ft'?(v*FT).toFixed(1):(v/FT).toFixed(2)});
  unit=u;applyUnit();update()}));
let raf=0;$('#form').addEventListener('input',e=>{if(e.target.matches('[data-kit]'))kitFromInputs();syncRows();cancelAnimationFrame(raf);raf=requestAnimationFrame(update)});
$('#form').addEventListener('change',e=>{if(e.target.id==='k_sel'){curKit=+e.target.value;kitToInputs()}else if(e.target.matches('[data-kit]'))kitFromInputs();syncRows();update()});
$('#secCheck').addEventListener('click',e=>{const li=e.target.closest('li');if(!li)return;toggle(li)});
$('#secCheck').addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&e.target.matches('li')){e.preventDefault();toggle(e.target)}});
function toggle(li){li.classList.toggle('done');li.setAttribute('aria-checked',li.classList.contains('done'));const t=li.textContent;let a=loadDone();a=li.classList.contains('done')?[...new Set([...a,t])]:a.filter(x=>x!==t);saveDone(a)}
$('#resetChecks').addEventListener('click',()=>{saveDone([]);update()});
const strip=h=>h.replace(/<[^>]+>/g,'');
$('#copyBtn').addEventListener('click',async()=>{
  const p=lastPlan;if(!p)return;
  const t=[p.title,'',p.setbar.map(s=>`${s.l}: ${s.v}`).join('\n'),'',p.layoutTitle.toUpperCase(),...p.layoutLines.map(strip),'','CAMERA',...p.camLines.map(strip),...(p.fxLines&&p.fxLines.length?['',p.fxTitle.toUpperCase(),...p.fxLines.map(strip)]:[]),'','LICHTEN',...p.lightRows.map(r=>`${r.id}. ${r.role} (${r.mod})\n   Plaats: ${r.place}\n   Hoogte ${r.height}, kantelen ${r.tilt}\n   Richten op: ${r.aim}\n   Vermogen: ${strip(r.power.replace('</b>','</b> '))}`),'','KIT: '+p.kitName,...p.kitLines.map(strip),...(p.warnings.length?['','LET OP',...p.warnings.map(w=>'- '+strip(w))]:[]),'','CHECKLIST',...p.checks.map(c=>'[ ] '+c)].join('\n');
  let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(e){}
  if(!ok){try{const a=$('#copyArea');a.value=t;a.select();ok=document.execCommand('copy')}catch(e){}}
  $('#toast').textContent=ok?'Plan gekopieerd':'Kopiëren lukt hier niet; selecteer de tekst handmatig';
  setTimeout(()=>$('#toast').textContent='',2500);
});

restore();applyMode();applyUnit();kitToInputs();syncRows();update();
})();
</script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:'){addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}</script>
</body>
</html>
